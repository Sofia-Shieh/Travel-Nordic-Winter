<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1140" viewBox="0 0 1000 1140" role="img" aria-labelledby="title desc">
<title id="title">罗弗敦 EVE 往返 · 四晚路线图</title><desc id="desc">非地理比例示意。2月7日抵达EVE；8日西行至Reine；9日经Å和Skagsanden到Leknes；10日经Henningsvær返回EVE；11日飞往斯德哥尔摩。</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8e0df" stroke-width=".6"/></pattern></defs>
<rect width="1000" height="1140" rx="20" fill="#edf0ea"/><rect width="1000" height="1140" fill="url(#grid)"/>
<g font-family="Arial,'Microsoft YaHei','PingFang SC',sans-serif" fill="#173c43">
<text x="56" y="64" font-size="17" letter-spacing="4">THE LOFOTEN ROADBOOK</text>
<text x="56" y="122" font-size="43" font-weight="700">先西行，再慢慢向东。</text>
<text x="56" y="163" font-size="21">07—11 FEB 2027 · EVE IN / EVE OUT</text>
<rect x="56" y="192" width="888" height="58" rx="10" fill="#173c43"/>
<text x="80" y="230" font-size="20" fill="#fff">4 晚 / 3 个完整游览日 · 2 晚机场缓冲 + 2 晚群岛</text>
<path d="M120 300V895" stroke="#adc2bd" stroke-width="4" fill="none"/>
<g fill="#fff" stroke="#173c43" stroke-width="3"><circle cx="120" cy="310" r="12"/><circle cx="120" cy="440" r="12"/><circle cx="120" cy="580" r="12"/><circle cx="120" cy="720" r="12"/><circle cx="120" cy="860" r="12"/></g>
<g font-size="17" font-weight="700"><text x="57" y="350">02/07</text><text x="57" y="480">02/08</text><text x="57" y="620">02/09</text><text x="57" y="760">02/10</text><text x="57" y="900">02/11</text></g>
<g>
<rect x="166" y="280" width="760" height="112" rx="12" fill="#dce5e1"/>
<text x="190" y="316" font-size="24" font-weight="700">Tromsø → EVE</text><text x="190" y="347" font-size="18">16:45—18:05 · 经停 Andenes · 取车后休息</text><text x="190" y="375" font-size="18" fill="#4d6965">住 EVE 附近 · 不夜间长途进岛</text>
<rect x="166" y="410" width="760" height="122" rx="12" fill="#d5e0ed"/>
<text x="190" y="446" font-size="24" font-weight="700">EVE → E10 → Reine</text><text x="190" y="478" font-size="18">Svolvær 短休 · Leknes 补给 · Hamnøy / Sakrisøy</text><text x="190" y="509" font-size="18" fill="#325b79">住 Reine 片区 · 最长驾驶日，删去支线</text>
<rect x="166" y="550" width="760" height="122" rx="12" fill="#eee0cc"/>
<text x="190" y="586" font-size="24" font-weight="700">Reine → Å → Skagsanden → Leknes</text><text x="190" y="618" font-size="18">雷讷港湾 · 红黄渔屋 · Å 镇 · 白沙滩</text><text x="190" y="649" font-size="18" fill="#815d34">住 Leknes · Ramberg 顺路可选</text>
<rect x="166" y="690" width="760" height="122" rx="12" fill="#dce5e1"/>
<text x="190" y="726" font-size="24" font-weight="700">Leknes → Henningsvær → EVE</text><text x="190" y="758" font-size="18">亨宁斯维尔渔港 · Svolvær 短休 · 默认 E10</text><text x="190" y="789" font-size="18" fill="#4d6965">住 EVE 附近 · 815 仅天气好时替代部分路段</text>
<rect x="166" y="830" width="760" height="112" rx="12" fill="#dce5e1"/>
<text x="190" y="866" font-size="24" font-weight="700">EVE → Oslo → Stockholm ARN</text><text x="190" y="897" font-size="18">约08:30还车 · 10:55起飞 · 14:55抵达</text><text x="190" y="925" font-size="18" fill="#4d6965">住 ARN · 奥斯陆65分钟转机，核实联程保障</text>
</g>
<path d="M56 980H944" stroke="#adc2bd"/>
<text x="56" y="1016" font-size="18" font-weight="700">WEATHER GETS THE FINAL SAY.</text>
<text x="56" y="1048" font-size="17">每天先查天气与路况。无冰雪经验，不赶夜路、不为打卡冒险。</text>
<text x="56" y="1080" font-size="16" fill="#57736e">路线顺序示意，非导航地图；时刻为候选方案，非已预订确认。</text>
